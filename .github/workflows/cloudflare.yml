# Máy chủ mới trên Cloudflare (Pages + Functions + D1).
# - Mọi lần push / PR: chạy kiểm thử máy chủ + thử đóng gói giao diện.
# - Push lên main: triển khai bản chính thức. Chạy tay (Run workflow) trên nhánh khác: bản xem trước.
# Cần 2 secret: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (xem README-DEPLOY.md, mục Máy chủ Cloudflare).
# Sau khi bật Cloudflare Access: variables ACCESS_TEAM_DOMAIN, ACCESS_AUD và secret ADMIN_EMAILS
# (được ghi vào wrangler.toml của lần triển khai bởi scripts/write-vars.mjs).
name: Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm thử máy chủ (phân quyền, đăng nhập, nhật ký)
        run: npm run test:server
      - name: Kiểm thử đồng bộ Timesheet trên trình duyệt (logic gộp, mất mạng, hai thiết bị)
        run: npm run test:client
      - name: Thử đóng gói giao diện
        run: npm run build:pages

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Tên dự án Pages = phần đầu địa chỉ <tên>.pages.dev. Đổi bằng variable PAGES_PROJECT (chữ thường, số, dấu gạch ngang)
      PROJECT: ${{ vars.PAGES_PROJECT || 'trackingts' }}
      DB_NAME: trackingts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Kiểm tra secret
        run: |
          if ! printf '%s' "$PROJECT" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,56}[a-z0-9])?$'; then
            echo "::error::PAGES_PROJECT='$PROJECT' không hợp lệ: chỉ chữ thường, số, dấu gạch ngang; không bắt đầu / kết thúc bằng gạch ngang"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Chưa có secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Cơ sở dữ liệu D1 (tạo nếu chưa có)
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const db = JSON.parse(s).find(x => x.name === process.env.DB_NAME);
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Tạo D1 $DB_NAME (vùng châu Á – Thái Bình Dương)"
            npx wrangler d1 create "$DB_NAME" --location apac
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::Không tìm thấy / tạo được D1 $DB_NAME"; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          echo "D1: $DB_NAME"

      - name: Cập nhật cấu trúc D1 (migrations)
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Dự án Pages (tạo nếu chưa có)
        run: npx wrangler pages project create "$PROJECT" --production-branch main || echo "Dự án $PROJECT đã có"

      - name: Cấu hình đăng nhập (ghi vào cấu hình triển khai)
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          # Bản trước đặt 3 giá trị này dạng "secret" của dự án Pages; xoá đi để không trùng tên với cấu hình mới
          for k in ADMIN_EMAILS ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            npx wrangler pages secret delete "$k" --project-name "$PROJECT" >/dev/null 2>&1 || true
          done
          node scripts/write-vars.mjs

      - name: Đóng gói giao diện
        run: npm run build:pages

      - name: Triển khai
        run: |
          npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s | head -c 300)"
