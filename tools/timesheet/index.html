<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- Bộ công cụ: phải đăng nhập ở trang chủ trước khi vào -->
<script src="../../js/demo.js?v=2"></script>
    <script src="../../js/session.js?v=45"></script>
    <script>Session.guard('timesheet');</script>
    <!-- Dữ liệu Dự án dùng CHUNG với "Thống kê giờ công dự án" (cùng IndexedDB, nguồn Google Drive) -->

    <script src="../../js/db.js?v=37"></script>
    <script src="../../js/cloud.js?v=42"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- FileSaver (nhỏ) dùng cho Backup & Xuất Excel. ExcelJS và mẫu bảng chấm công (ts-template.xlsx)
         chỉ tải khi bấm Xuất Excel — xem src/app.jsx. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        input, select, textarea { font-size: 16px !important; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        /* gợi ý dự án trong form */
        .suggestion-list {
            position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px);
            max-height: 18rem; overflow-y: auto; background: #fff;
            border: 1px solid #cbd5e1; border-radius: 0.75rem;
            box-shadow: 0 12px 28px -8px rgba(15, 23, 42, .25); padding: 0.25rem;
        }
        .suggestion-item { padding: 0.5rem 0.625rem; font-size: 0.875rem; line-height: 1.35; cursor: pointer; border-radius: 0.5rem; }
        .suggestion-item:hover, .suggestion-item[aria-selected="true"] { background-color: #eff6ff; }
        /* ngăn trượt: máy tính trượt từ phải, điện thoại hiện toàn màn hình */
        @keyframes ts-slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes ts-fade-in { from { opacity: 0; } to { opacity: 1; } }
        .ts-drawer { animation: ts-slide-in .18s ease-out; padding-bottom: env(safe-area-inset-bottom); }
        .ts-fade { animation: ts-fade-in .18s ease-out; }
        @media (prefers-reduced-motion: reduce) { .ts-drawer, .ts-fade { animation: none; } }

        /* ---------- Báo cáo tổng quan (khổ A4 dọc; In / Lưu PDF) ---------- */
        body.ts-report-open { overflow: hidden; }
        .rp-overlay { position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: #e2e8f0; color: #0f172a; }
        .rp-toolbar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            padding: 10px 16px; background: rgba(255,255,255,.96); border-bottom: 1px solid #cbd5e1; }
        .rp-hint { font-size: 12px; color: #64748b; }
        .rp-page { box-sizing: border-box; width: 100%; max-width: 210mm; margin: 16px auto 32px; background: #fff;
            padding: 14mm 12mm; box-shadow: 0 4px 24px rgba(15,23,42,.12); font-size: 11.5px; line-height: 1.4; }
        .rp-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-bottom: 2px solid #0f172a; padding-bottom: 10px; }
        .rp-kicker { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #dc0000; }
        .rp-head h1 { margin: 2px 0 0; font-size: 20px; line-height: 1.2; font-weight: 700; }
        .rp-sub { margin-top: 2px; font-size: 12.5px; color: #334155; font-weight: 600; }
        .rp-who { display: grid; grid-template-columns: auto auto; gap: 1px 10px; margin: 0; font-size: 11px; }
        .rp-who div { display: contents; }
        .rp-who dt { color: #64748b; }
        .rp-who dd { margin: 0; font-weight: 600; }
        .rp-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 4px; }
        .rp-kpi { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
        .rp-kpi span { font-size: 10.5px; color: #475569; }
        .rp-kpi b { font-size: 20px; line-height: 1.25; font-variant-numeric: tabular-nums; }
        .rp-kpi small { font-size: 11px; font-weight: 500; color: #64748b; }
        .rp-kpi em { font-style: normal; font-size: 10.5px; color: #64748b; }
        .rp-kpi.rp-warn { border-color: #fda4af; background: #fff1f2; }
        .rp-kpi.rp-warn em { color: #be123c; font-weight: 600; }
        .rp-blue { color: #1d4ed8; } .rp-orange { color: #c2410c; }
        .rp-sec { margin-top: 10px; min-width: 0; break-inside: avoid; }
        .rp-sec h2 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #0f172a; }
        .rp-sec h3 { margin: 8px 0 4px; font-size: 11.5px; font-weight: 700; color: #334155; }
        .rp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .rp-chartwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .rp-chart { width: 100%; height: auto; display: block; }
        .rp-axis { font-size: 9px; fill: #64748b; font-variant-numeric: tabular-nums; }
        .rp-red { fill: #e11d48; }
        .rp-gname { font-size: 10px; font-weight: 600; fill: #0f172a; }
        .rp-gtxt { font-size: 8.5px; font-weight: 600; fill: #fff; font-variant-numeric: tabular-nums; pointer-events: none; }
        .rp-gcell { cursor: pointer; }
        .rp-gcell:hover rect:first-of-type { opacity: .85; }
        .rp-gantt { min-width: 640px; }
        .rp-leave { fill: #7c3aed; color: #7c3aed; font-weight: 700; }
        .rp-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 10.5px; color: #334155; }
        .rp-legend span { display: inline-flex; align-items: center; gap: 5px; }
        .rp-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        .rp-legend i.rp-dot { width: 6px; height: 6px; border-radius: 50%; background: #e11d48; }
        .rp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .rp-table th { text-align: left; font-weight: 600; color: #475569; font-size: 10.5px; border-bottom: 1px solid #cbd5e1; padding: 3px 4px; }
        .rp-table td { border-bottom: 1px solid #f1f5f9; padding: 3px 4px; vertical-align: top; }
        .rp-table tfoot td { border-top: 1px solid #cbd5e1; border-bottom: 0; font-weight: 600; }
        .rp-table .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .rp-table .b { font-weight: 700; }
        .rp-wbar { width: 34%; white-space: nowrap; }
        .rp-bar { display: inline-block; vertical-align: middle; width: calc(100% - 42px); height: 8px; background: #f1f5f9; border-radius: 2px; overflow: hidden; }
        .rp-bar > span { display: block; height: 100%; border-radius: 0 4px 4px 0; }
        .rp-pct { display: inline-block; width: 40px; text-align: right; font-size: 10.5px; color: #334155; font-variant-numeric: tabular-nums; }
        .rp-name { font-weight: 600; }
        .rp-mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: #475569; }
        .rp-muted { color: #64748b; font-size: 10.5px; }
        .rp-empty { color: #64748b; font-style: italic; }
        .rp-cats, .rp-list { list-style: none; margin: 0; padding: 0; font-size: 11px; }
        .rp-cats li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #e2e8f0; padding: 2px 0; }
        .rp-list li { padding: 1px 0; }
        .rp-list b { display: inline-block; width: 38px; color: #e11d48; }
        .rp-foot { margin-top: 10px; border-top: 1px solid #cbd5e1; padding-top: 8px; font-size: 10px; color: #475569; break-inside: avoid; }
        .rp-foot p { margin: 0; }
        .rp-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 10px; text-align: center; font-size: 11px; color: #0f172a; }
        .rp-sign span { display: block; font-weight: 600; }
        .rp-sign i { display: block; height: 28px; }
        @media (max-width: 720px) {
            .rp-page { margin: 0; padding: 14px 12px; box-shadow: none; }
            .rp-kpis { grid-template-columns: repeat(2, 1fr); }
            .rp-kpis .rp-kpi:first-child { grid-column: 1 / -1; }
            .rp-cols { grid-template-columns: 1fr; gap: 0; }
            .rp-chart { min-width: 620px; } /* điện thoại: giữ chữ đọc được, vuốt ngang để xem */
        }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body.ts-report-open { overflow: visible; background: #fff !important; }
            body.ts-report-open #root > div > :not(.rp-overlay) { display: none !important; }
            body.ts-report-open #root > div { min-height: 0 !important; background: #fff !important; }
            .rp-overlay { position: static; overflow: visible; background: #fff; }
            .rp-toolbar { display: none !important; }
            .rp-page { margin: 0; max-width: none; padding: 0; box-shadow: none; }
            .rp-kpis { grid-template-columns: repeat(5, 1fr) !important; }
            .rp-kpis .rp-kpi:first-child { grid-column: auto !important; }
            .rp-cols { grid-template-columns: 1fr 1fr !important; gap: 16px !important; }
            .rp-chart { min-width: 0 !important; }
            .rp-chartwrap { overflow: visible; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
    <!-- CSS Tailwind đã biên dịch sẵn (npm run build), đặt sau <style> như bản play CDN trước đây -->
    <link rel="stylesheet" href="tailwind.css?v=47">
</head>

</html>
